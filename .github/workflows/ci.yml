name: build-and-db

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build front-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build

  database:
    name: Validate Supabase migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      PGPASSWORD: postgres
      PSQL: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Stub Supabase schemas
        run: $PSQL -f supabase/tests/000_stub.sql

      - name: Apply migrations
        run: |
          for file in supabase/migrations/*.sql; do
            echo "Applying $file"
            $PSQL -f "$file"
          done

      - name: Smoke-test triggers and RLS
        run: $PSQL -f supabase/tests/001_smoke.sql

name: supabase-migrate

# Manual only — this changes the live database.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE to apply supabase/migrations to the live database'
        required: true

permissions:
  contents: read

jobs:
  migrate:
    if: github.event.inputs.confirm == 'MIGRATE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL repository secret first."
            exit 1
          fi
          supabase db push --remote="$SUPABASE_DB_URL" --include-all --yes
